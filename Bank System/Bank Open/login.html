<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>S.K Bank Login</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:470px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 12px 35px rgba(0,0,0,0.35);
  color:#fff;
}

h1{
  text-align:center;
  margin-bottom:10px;
  font-size:32px;
  color:#00c6ff;
}

.subtitle{
  text-align:center;
  font-size:14px;
  color:#d8f3ff;
  margin-bottom:22px;
}

.form-group{
  margin-bottom:16px;
}

label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:none;
  outline:none;
  border-radius:12px;
  font-size:15px;
  background:rgba(255,255,255,0.93);
  color:#222;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#00c6ff,#0072ff);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

.btn:hover{
  opacity:0.9;
}

.message{
  margin-top:16px;
  padding:12px;
  border-radius:12px;
  text-align:center;
  display:none;
  font-size:14px;
}

.success{
  background:rgba(0,200,83,0.18);
  color:#b9ffd0;
  border:1px solid rgba(0,200,83,0.35);
  display:block;
}

.error{
  background:rgba(255,82,82,0.16);
  color:#ffd1d1;
  border:1px solid rgba(255,82,82,0.35);
  display:block;
}

.details-box{
  margin-top:18px;
  padding:16px;
  border-radius:16px;
  background:rgba(255,255,255,0.10);
  display:none;
}

.details-box p{
  margin:8px 0;
  font-size:15px;
}

.balance{
  margin-top:12px;
  padding:14px;
  border-radius:14px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  background:linear-gradient(
    90deg,
    rgba(0,198,255,0.18),
    rgba(0,114,255,0.25)
  );
}

.btc{
  margin-top:12px;
  padding:14px;
  border-radius:14px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  background:rgba(247,147,26,0.15);
  color:#ffb347;
}

.time{
  margin-top:12px;
  text-align:center;
  font-size:13px;
  opacity:0.8;
}

</style>
</head>

<body>

<div class="container">

  <h1>S.K Bank</h1>

  <p class="subtitle">
    Bitcoin Banking Login System
  </p>

  <form id="loginForm">

    <div class="form-group">

      <label>
        Account Number
      </label>

      <input
        type="text"
        id="accountNumber"
        placeholder="Enter account number"
        required
      >

    </div>

    <div class="form-group">

      <label>
        Mobile Number
      </label>

      <input
        type="text"
        id="mobileNumber"
        placeholder="Enter mobile number"
        maxlength="10"
        required
      >

    </div>

    <button
      type="submit"
      class="btn"
    >
      Login
    </button>

  </form>

  <div
    id="messageBox"
    class="message"
  ></div>

  <div
    id="detailsBox"
    class="details-box"
  >

    <p>
      <strong>Bank Name:</strong>
      S.K Bank
    </p>

    <p>
      <strong>Full Name:</strong>
      <span id="showName"></span>
    </p>

    <p>
      <strong>Account Number:</strong>
      <span id="showAccount"></span>
    </p>

    <p>
      <strong>Customer Number:</strong>
      <span id="showCustomer"></span>
    </p>

    <p>
      <strong>Bitcoin Account:</strong>
      <span id="showBitcoin"></span>
    </p>

    <div class="balance">
      ₹<span id="showBalance"></span>
    </div>

    <div class="btc">
      <span id="showBTC"></span> BTC
    </div>

    <div class="time">
      Last Login:
      <span id="showTime"></span>
    </div>

  </div>

</div>

<script>

// ====================================
// STORAGE
// ====================================

function getUsers(){

  return JSON.parse(
    localStorage.getItem("sk_bank_users")
  ) || [];
}

function saveUsers(users){

  localStorage.setItem(
    "sk_bank_users",
    JSON.stringify(users)
  );
}

// ====================================
// DEMO USER
// ====================================

function createDemoUser(){

  let users = getUsers();

  if(users.length === 0){

    users.push({

      fullName:"Demo User",

      accountNumber:"12345",

      customerNumber:"999",

      mobile:"9876543210",

      balance:500000,

      bitcoinBalance:0.025,

      bitcoinAccount:"BTC-SK-908776",

      history:[]

    });

    saveUsers(users);
  }
}

createDemoUser();

// ====================================
// ELEMENTS
// ====================================

const loginForm =
document.getElementById("loginForm");

const messageBox =
document.getElementById("messageBox");

const detailsBox =
document.getElementById("detailsBox");

// ====================================
// MESSAGE
// ====================================

function showMessage(text,type){

  messageBox.style.display = "block";

  messageBox.className =
    "message " + type;

  messageBox.textContent = text;
}

// ====================================
// LOGIN
// ====================================

loginForm.addEventListener(

  "submit",

  function(e){

    e.preventDefault();

    let accountNumber =
      document
      .getElementById("accountNumber")
      .value
      .trim();

    let mobileNumber =
      document
      .getElementById("mobileNumber")
      .value
      .trim();

    // validation
    if(!/^[0-9]{10}$/.test(mobileNumber)){

      showMessage(
        "Enter valid 10 digit mobile number",
        "error"
      );

      return;
    }

    let users = getUsers();

    let foundUser = users.find(

      user =>

      user.accountNumber === accountNumber &&

      (
        user.mobile === mobileNumber ||
        user.mobileNumber === mobileNumber
      )

    );

    // invalid
    if(!foundUser){

      showMessage(
        "Invalid Login Details",
        "error"
      );

      detailsBox.style.display = "none";

      return;
    }

    // fix bitcoin balance
    if(!foundUser.bitcoinBalance){
      foundUser.bitcoinBalance = 0;
    }

    // create bitcoin account
    if(!foundUser.bitcoinAccount){

      foundUser.bitcoinAccount =
        "BTC-SK-" +
        Math.floor(
          100000 + Math.random()*900000
        );
    }

    // last login
    foundUser.lastLogin =
      new Date().toLocaleString();

    // save logged user
    localStorage.setItem(
      "loggedUser",
      JSON.stringify(foundUser)
    );

    // update users
    saveUsers(users);

    // success
    showMessage(
      "Login Successful ✔",
      "success"
    );

    // show details
    document.getElementById(
      "showName"
    ).textContent =
      foundUser.fullName;

    document.getElementById(
      "showAccount"
    ).textContent =
      foundUser.accountNumber;

    document.getElementById(
      "showCustomer"
    ).textContent =
      foundUser.customerNumber;

    document.getElementById(
      "showBitcoin"
    ).textContent =
      foundUser.bitcoinAccount;

    document.getElementById(
      "showBalance"
    ).textContent =
      Number(foundUser.balance)
      .toLocaleString();

    document.getElementById(
      "showBTC"
    ).textContent =
      Number(foundUser.bitcoinBalance)
      .toFixed(8);

    document.getElementById(
      "showTime"
    ).textContent =
      foundUser.lastLogin;

    detailsBox.style.display =
      "block";

    loginForm.reset();

  }

);

</script>

</body>
</html>
